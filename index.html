try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);if(x.v===1&&Number.isInteger(x.step)&&x.step>=0&&x.step<steps.length&&x.players&&x.notes&&Array.isArray(x.seen)&&x.hints)s={...s,...x,players:{A:String(x.players.A||'Player A').slice(0,24),B:String(x.players.B||'Player B').slice(0,24)},seen:x.seen.filter(id=>Object.hasOwn(data.cards,id)),reveal:Number.isInteger(x.reveal)?Math.max(0,Math.min(4,x.reveal)):0};}localStorage.setItem(KEY,JSON.stringify(s));}catch(e){saveOK=false;}

function home(){mode='home';open=false;screen(`<div class="coverdisc" aria-hidden="true">M17</div><div class="eyebrow">A mystery for two</div><h1>The Meridian<br>Swap</h1><p class="lede">Two people.<br>Two different versions of the truth.<br>One case.</p><p>Glass breaks. The station’s last broadcast is still in the display. Except it isn’t the original.</p><p class="muted">2 players · one device · allow 30–45 minutes</p><div class="actions">${s.started?btn('Continue game','continue'):btn('Start case','setup')}</div><p class="note">You see different clues. The interesting part happens between you.</p><details><summary>Before you start</summary><p>No host, printer, sound or internet needed. Take turns looking; your partner looks away. You are both detectives, not secret suspects.</p><p>Use a browser, not a file preview. Local HTML opening varies by phone. This offline edition is best opened on a computer; iPhone and iPad file previews may not run the game.</p><p>Progress saves in this browser when available. Keep this file in the same place. ${saveOK?'':'Saving is unavailable here. Keep this tab open until you finish.'}</p></details>`);}

if(st.t==='intro')screen(`${head(0,'17 October 2026 / Meridian Hall','Find it before the van comes.')}<p class="lede">The old radio station is selling its final 1968 broadcast to fix the roof. Someone replaced the original with a rehearsal record.</p><p>Four staff are still here. The next van comes at 20:45. You need a person, a time, a method, a place—and a reason that fits.</p><div class="note">A gets the building’s records.<br>B gets the paper people left behind.<br>Neither gets the whole story.</div><p>Read privately. Hide the evidence before passing. Then talk honestly. You may show a clue once you have tried describing it.</p><p><b>Fair-play rules:</b> logs, measurements and signed forms are genuine and complete for the periods shown. Spoken accounts may be mistaken. Only a clue can make a clock wrong.</p><p>Four suspects. One swapper. No accomplice, secret route, extra record or altered weight. Everything you need is here.</p><div class="actions">${btn('Meet the four staff','next')}</div>`);
if(st.t==='hunch')screen(`${head(0,'First impressions','Who do you suspect?')}<div class="suspects"><article><h3>Mara</h3><small>Producer</small><p>Three roof quotes folded in her catalogue. Straightens the display lamp whenever she passes. “If we lose the building, where do the records go?”</p></article><article><h3>Ellis</h3><small>Engineer</small><p>Made the rehearsal record. Labels everything DO NOT TOUCH, then plays it for you. “It’s radio. It was meant to be heard.”</p></article><article><h3>Noor</h3><small>Archivist</small><p>Crosses out “miscellaneous” on every box. Asked Mara twice whether the new sale terms were really final.</p></article><article><h3>Kit</h3><small>Courier</small><p>Knows every cupboard. Says yes to one more job, then complains about doing six. Tonight: parcels, collections, drinks.</p></article></div><p>Each pick someone and say why. A hunch, not a promise.</p><label for="hA">${esc(s.players.A)}’s first guess</label>${select('hA',s.notes.hA)}<label for="hB">${esc(s.players.B)}’s first guess</label>${select('hB',s.notes.hB)}<div class="actions">${btn('Keep our hunches · Round 1','hunch')}</div>`);
if(st.t==='talk')screen(`${head(st.r,'Together / put the device between you',st.title)}<p class="lede">${st.prompt}</p>${s.notes.firstsuspect&&st.r===2&&st.end?`<p class="chosen">Earlier you suspected ${esc(s.notes.firstsuspect)}. Still your suspect?</p>`:''}<label for="theory">${st.label}</label>${st.suspect?select('theory',s.notes[st.key]):`<textarea id="theory" placeholder="${st.placeholder}">${esc(s.notes[st.key])}</textarea>`}<p class="muted">Say it aloud. Notes are optional and save as you type. No score, no hurry.</p>${tools(st.r,st.end)}<div class="actions">${btn(st.next,'theory')}</div>`);
if(st.t==='final')screen(`${head(3,'Together / final accusation','Make your case.')}<p>Each take a turn. One explains; the other asks “which clue proves that?” You can reopen any evidence.</p>${[['who','Who made the swap?'],['when','When? Give the release interval.'],['how','How? Which fob and mechanism?'],['where','Where? Parcel, room and bay.'],['why','Why? What is proved, and what is inferred?']].map(([id,l])=>`<label for="f_${id}">${l}</label>${id==='who'?select('f_'+id,s.notes['f_'+id]):`<textarea id="f_${id}">${esc(s.notes['f_'+id])}</textarea>`}`).join('')}<p class="muted">You may answer aloud instead of typing. Your reasoning matters more than exact wording.</p>${tools(3,true)}<div class="actions">${btn('We have our case','next')}</div>`);
if(st.t==='ready')screen(`${head(0,'Last chance before spoilers','One thing your partner noticed.')}<p class="lede">Each say something your partner found that you missed.</p><p>If you disagree, test your strongest alternative against one clue. You don’t have to agree about whether the swap was right.</p><p>The next screen begins the solution.</p><div class="actions">${btn('Reveal the truth together','next')}${btn('Go back to our accusation','backfinal',true)}</div>`);

if(st.t==='closed')screen(`${head(0,'Case closed','You found the original.')}<p class="lede">A had the times, movements and places.<br>B had the clock, names and promises.</p><div class="paper"><p>The glass was dramatic. The decisive things were smaller: a clock nobody reset, a favour at the desk, a pin on a sketch, a message without a name.</p></div><p class="chosen">First guesses: ${esc(s.players.A)} → ${esc(s.notes.hA||'kept it to themselves')}; ${esc(s.players.B)} → ${esc(s.notes.hB||'kept it to themselves')}.</p><p>Who changed their mind first?</p><p>Which clue did your partner notice before you?</p><p>Would you have stopped the sale another way?</p><p class="muted">The original is found. What the audit decides is another question.</p><div class="actions">${btn('Read the proof again','proof',true)}${btn('Restart case','restart',true)}</div>`);
}
function gate(p){mode=review?'reviewgate':'gate';open=false;screen(`<div class="gate"><div class="eyebrow">Private evidence / Player ${p}</div><div class="seal" aria-hidden="true">${p}</div><h1>Pass to ${esc(s.players[p])}.</h1><p>Only Player ${p} should look.<br>Your partner looks away before you tap.</p><div class="actions">${btn('Show my evidence','show')}</div>${review?btn('Return to our investigation','return',true):''}<p class="muted">Nothing private is visible yet.</p></div>`,true);}
function showCard(){mode='card';open=true;const st=steps[s.step],ids=review?review.ids:st.ids;const id=ids[ci],c=data.cards[id];if(!s.seen.includes(id)){s.seen.push(id);save();}
const p=review?review.p:st.p;screen(`<div class="eyebrow">Only ${esc(s.players[p])} / Player ${p} · ${c.id}</div><h2>${c.title}</h2><p class="muted">${review?'Your opened evidence':`Envelope ${ci+1} of ${ids.length}`} · Your partner has different clues.</p><article class="paper evidence-${c.kind}">${c.body}</article><p class="note">${c.ask}</p><div class="actions">${ci>0?btn('Previous card','prevcard',true):''}${ci<ids.length-1?btn('Next evidence card','nextcard'):btn(review?'Hide & return to investigation':'Hide evidence & pass device','pass')}</div><div class="actions">${btn('Hide this screen','lock',true)}${review?btn('Choose another card','reviewindex',true):btn('Reopen an earlier card','privatearchive',true)}</div>`,true);}
function archive(){mode='archive';open=false;screen(`${head(0,'Private evidence folders','Whose clues do you need?')}<p>Only cards you have already opened are available. Pass the device before opening a folder.</p><div class="actions">${btn('Player A’s folder','folderA')}${btn('Player B’s folder','folderB')}</div><div class="actions">${btn('Return to investigation','return',true)}</div>`);}
function folderIndex(){mode='folder';open=true;screen(`${head(0,'Private / Player '+review.p,'Your opened evidence.')}<p>Only ${esc(s.players[review.p])} should look. Choose a card.</p><div class="reviewlist">${review.ids.map(id=>btn(id+' · '+data.cards[id].title,'pick_'+id,true)).join('')}</div><div class="actions">${btn('Hide & return to investigation','return',true)}</div>`,true);}
function listFolder(p){review={p,ids:s.seen.filter(id=>id[0]===p).sort()};ci=0;gate(p);}
function hints(){mode='hints';open=false;const r=steps[s.step].r||3;hintCount=s.hints[r]||0;screen(`${head(r,'Optional / no penalty','A nudge when you want one.')}<p>Start small. Stop as soon as you can carry on. Hint 3 gives the round’s answer.</p>${data.hints[r-1].slice(0,hintCount).map((h,i)=>`<div class="hint"><b>Hint ${i+1}</b><p>${h}</p></div>`).join('')}<div class="actions">${hintCount<3?btn('Show hint '+(hintCount+1),'morehint'):''}${btn('Back to our theory','return',true)}</div>`);}
function showReveal(){const r=data.reveals[s.reveal];screen(`${head(0,'The proof / '+r[0],r[1])}${r[2]}<p class="stamp">Your two halves: ${r[3]}</p>${s.notes['f_'+r[0].toLowerCase()]?`<div class="chosen">Your answer: ${esc(s.notes['f_'+r[0].toLowerCase()])}</div>`:''}<div class="actions">${s.reveal>0?btn('Previous part','prevreveal',true):''}${btn(s.reveal===4?'Close the case together':'Next part of the truth','nextreveal')}</div>`);}
function pause(){open=false;mode='menu';screen(`${head(0,'Paused / evidence hidden','Take your time.')}<p>${saveOK?'Progress is saved in this browser. Reopening the game starts behind a privacy screen.':'This browser cannot save progress. Keep this tab open until you finish.'}</p><div class="actions">${btn('Continue game','continue')}${btn('Our notes','notes',true)}${btn('Restart case','restart',true)}</div><p class="muted">Your names and notes stay here. Nothing is sent anywhere.</p>`);}
function restart(){open=false;mode='restart';screen(`${head(0,'Start over?','Clear this case?')}<p>This removes your saved progress, names, guesses and notes on this device. The game files stay.</p><div class="actions"><button class="danger" data-action="confirmrestart">Yes, clear progress</button>${btn('Keep our game','continue',true)}</div>`);}
app.addEventListener('input',e=>{if(e.target.id==='theory'){s.notes[steps[s.step].key]=e.target.value;save();}if(e.target.id.startsWith('f_')){s.notes[e.target.id]=e.target.value;save();}});
app.addEventListener('change',e=>{if(e.target.id==='theory'){s.notes[steps[s.step].key]=e.target.value;save();}if(e.target.id==='f_who'){s.notes.f_who=e.target.value;save();}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
if(a==='home')home();if(a==='setup')setup();if(a==='begin'){s.players.A=$('#nameA').value.trim()||'Player A';s.players.B=$('#nameB').value.trim()||'Player B';s.started=true;save();render();}
if(a==='continue'){review=null;ci=0;render();}if(a==='next')advance();if(a==='hunch'){s.notes.hA=$('#hA').value;s.notes.hB=$('#hB').value;advance();}
if(a==='show'){if(review&&!review.ids.length){screen('<h1>No opened cards yet.</h1>'+btn('Return to investigation','return'));open=false;}else if(review)folderIndex();else showCard();}
if(a.startsWith('pick_')&&review&&review.ids.includes(a.slice(5))){ci=review.ids.indexOf(a.slice(5));showCard();}
if(a==='nextcard'){ci++;showCard();}if(a==='prevcard'){ci--;showCard();}if(a==='lock')gate(review?review.p:steps[s.step].p);
if(a==='pass'){if(review){review=null;ci=0;render();}else advance();}
if(a==='theory'){s.notes[steps[s.step].key]=$('#theory').value;advance();}
if(a==='reviewindex')folderIndex();if(a==='archive'||a==='privatearchive')archive();if(a==='folderA')listFolder('A');if(a==='folderB')listFolder('B');if(a==='return'){review=null;ci=0;render();}
if(a==='hints')hints();if(a==='morehint'){const r=steps[s.step].r||3;s.hints[r]=Math.min(3,(s.hints[r]||0)+1);save();hints();}
if(a==='backfinal'){s.step=20;save();render();}if(a==='nextreveal'){if(s.reveal<4){s.reveal++;save();showReveal();}else advance();}if(a==='prevreveal'){s.reveal--;save();showReveal();}
if(a==='proof'){s.step=22;s.reveal=0;save();render();}if(a==='restart')restart();if(a==='confirmrestart'){s={v:1,step:0,started:false,players:{A:'Player A',B:'Player B'},notes:{},seen:[],hints:{},reveal:0};review=null;ci=0;save();home();}
if(a==='notes'){mode='notes';screen(`${head(0,'Shared notes','The theories you tried.')}<p>These are your words, not the solution.</p>${Object.entries(s.notes).filter(([k,v])=>v).map(([k,v])=>`<div class="paper"><small>${esc(({hA:'A’s first hunch',hB:'B’s first hunch',crash:'The crash',window:'Time window',firstsuspect:'Provisional suspect',accusation:'Person and action',parcel:'Parcel',purpose:'Place and purpose'})[k]||k.replace('f_','Final: '))}</small><p>${esc(v)}</p></div>`).join('')||'<p>No notes yet.</p>'}<div class="actions">${btn('Continue game','continue')}</div>`);}
});
$('#menu').addEventListener('click',pause);
function shield(){if(open){open=false;gate(review?review.p:steps[s.step].p);}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)shield();});window.addEventListener('pagehide',shield);window.addEventListener('blur',shield);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.started)pause();});
home();
})();
</script></body></html>
